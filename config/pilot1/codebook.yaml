    persona: V1
    options:
    - code: yes_formally_diagnosed
      it: Sì, ho una diagnosi formale
      en: Yes, formally diagnosed
    - code: self_identified
      it: Mi autoidentifico
      en: Self-identified
    - code: i_only_suspect_it
      it: Ho solo un sospetto
      en: I only suspect it
    - code: waiting_for_an_assessment
      it: Sono in attesa di una valutazione
      en: Waiting for an assessment
    - code: prefer_not_to_say
      it: Preferisco non rispondere
      en: Prefer not to say
      exclusive: true
  Q11:
