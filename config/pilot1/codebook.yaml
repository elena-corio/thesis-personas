    type: multi
    text_en: Health conditions that affect how they experience public spaces
    persona: V1
    options:
    - code: migraine_or_headaches
      it: Emicrania o mal di testa
      en: Migraine or headaches
    - code: epilepsy
      it: Epilessia
      en: Epilepsy
    - code: asthma_or_other_breathing
      it: Asma o altre difficoltà respiratorie
      en: Asthma or other breathing difficulties
    - code: allergies
      it: Allergie (es. ai pollini)
      en: Allergies (e.g. pollen)
    - code: chronic_pain_or_fatigue
      it: Dolore o stanchezza cronici
      en: Chronic pain or fatigue
    - code: mobility_or_walking_difficulties
      it: Difficoltà motorie o a camminare
      en: Mobility or walking difficulties
    - code: strong_sensitivity_to_light
