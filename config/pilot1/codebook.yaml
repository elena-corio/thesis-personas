version: '2026-10-14'
scenario:
  it: Guarda la foto e immagina di trascorrere qui 20 minuti in un pomeriggio feriale.
  en: Look at the photo and imagine spending 20 minutes here on a weekday afternoon.
persona_versions:
  V0: 'No persona: the default model answers as "a person".'
  V1: 'Labels: Q1–Q5 and Q7–Q11.'
  V2: 'Grounded: everything in V1 plus Q12–Q22 (attention-check row removed).'
  V3: 'Lived experience only: V0 plus Q12–Q22, without the V1 labels (demographics, health, neurodivergence).'
  analysis_only: Q6 and B1 are never given to any persona.
part_a:
  Q1:
    type: single
    text_en: Age
    persona: V1
    options:
    - code: '18_24'
      it: 18–24
      en: 18–24
    - code: '25_34'
      it: 25–34
      en: 25–34
    - code: '35_44'
      it: 35–44
      en: 35–44
    - code: '45_54'
      it: 45–54
      en: 45–54
    - code: '55_64'
      it: 55–64
      en: 55–64
    - code: 65_or_older
      it: 65 o più
      en: 65 or older
  Q2:
    type: single
    text_en: Gender
    persona: V1
    options:
    - code: woman
      it: Donna
      en: Woman
    - code: man
      it: Uomo
      en: Man
    - code: non_binary
      it: Non binario
      en: Non-binary
    - code: prefer_not_to_say
      it: Preferisco non rispondere
      en: Prefer not to say
      exclusive: true
    - code: other
      it: Altro
      en: Other
      free_text: true
  Q3:
    type: single
    text_en: Country of residence
    persona: V1
    options:
    - code: austria
      it: Austria
      en: Austria
    - code: another_european_country
      it: Altro paese europeo
      en: Another European country
    - code: outside_europe
      it: Fuori dall'Europa
      en: Outside Europe
    - code: prefer_not_to_say
      it: Preferisco non rispondere
      en: Prefer not to say
      exclusive: true
  Q4:
    type: single
    text_en: Type of place lived in
    persona: V1
    options:
    - code: large_city
      it: Grande città (oltre 500.000 abitanti)
      en: Large city (over 500,000 inhabitants)
    - code: medium_sized_city
      it: Città media (50.000–500.000 abitanti)
      en: Medium-sized city (50,000–500,000)
    - code: small_town
      it: Piccola città (5.000–50.000 abitanti)
      en: Small town (5,000–50,000)
    - code: village_or_countryside
      it: Paese o campagna (meno di 5.000 abitanti)
      en: Village or countryside (under 5,000)
    - code: i_move_around_a
      it: Mi sposto spesso / non ho un luogo fisso
      en: I move around a lot / no fixed place
  Q5:
    type: single
    text_en: Highest education
    persona: V1
    options:
    - code: secondary_school_or_less
      it: Scuola secondaria o inferiore
      en: Secondary school or less
    - code: vocational_training
      it: Formazione professionale
      en: Vocational training
    - code: bachelor_s_degree
      it: Laurea triennale
      en: Bachelor's degree
    - code: master_s_degree
      it: Laurea magistrale o a ciclo unico
      en: Master's degree
    - code: doctorate
      it: Dottorato di ricerca
      en: Doctorate (PhD)
  Q6:
    type: single
    text_en: Familiarity with Vienna
    persona: analysis_only
    options:
    - code: i_live_there_now
      it: Ci vivo ora
      en: I live there now
    - code: i_lived_there_before
      it: Ci ho vissuto in passato
      en: I lived there before
    - code: i_have_visited
      it: L'ho visitata
