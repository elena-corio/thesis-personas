    - code: ptsd_or_cptsd
      it: PTSD o CPTSD (disturbo da stress post-traumatico, anche complesso)
      en: PTSD or CPTSD
    - code: none_of_these
      it: Nessuna di queste
      en: None of these
      exclusive: true
    - code: prefer_not_to_say
      it: Preferisco non rispondere
      en: Prefer not to say
      exclusive: true
    - code: other
      it: Altro
      en: Other
      free_text: true
