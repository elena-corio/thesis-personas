    - code: being_alone
      it: Restare da sol*
      en: Being alone
    - code: moving
      it: Muovermi (camminare, dondolarmi)
      en: Moving (walking, rocking)
    - code: drinking_or_eating_something
      it: Bere o mangiare qualcosa
