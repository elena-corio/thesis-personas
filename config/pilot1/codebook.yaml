      en: Prefer not to say
      exclusive: true
    - code: other
      it: Altro
      en: Other
      free_text: true
  Q14:
    type: scale_1_5
    text_en: How often they feel overwhelmed in public spaces (1 = never, 5 = almost always)
    persona: V2
  Q15:
    type: grid_1_5
    text_en: How much each situation makes it hard to be in a public space (1 = not at all, 5 = very much)
    persona: V2
    rows:
    - code: sensory_overload
      it: Troppi stimoli sensoriali (rumore, luce, odori, caldo)
      en: Too much sensory input (noise, light, smells, heat)
    - code: crowded_chaotic_narrow
      it: Luoghi affollati, caotici o stretti
      en: Crowded, chaotic or narrow places
    - code: uncertainty
      it: Incertezza su cosa aspettarsi (luoghi sconosciuti o che cambiano)
      en: Uncertainty about what to expect (unfamiliar or changing places)
    - code: no_place_to_retreat
      it: Mancanza di un posto dove allontanarsi, riposare o riprendersi
      en: Lack of a place to step away, rest or recover
  Q16:
    type: grid_1_5
    text_en: How much each sense influences their experience of public spaces, positively or negatively (1 = not at all, 5
      = very much)
    persona: V2
    rows:
    - code: hearing
      it: Udito (suoni, rumori)
      en: Hearing (sounds, noise)
    - code: sight
      it: Vista (luce, colori, ciò che vedi)
      en: Sight (light, colours, what you see)
    - code: smell
      it: Olfatto (odori, profumi)
      en: Smell (odours, scents)
    - code: touch
      it: Tatto (superfici, caldo o freddo sulla pelle)
      en: Touch (surfaces, heat or cold on the skin)
    - code: balance
      it: Equilibrio (movimento, terreno irregolare, folla in movimento)
      en: Balance (movement, uneven ground, moving crowds)
    - code: proprioception
      it: Percezione del corpo nello spazio (valutare le distanze, urtare cose o persone)
      en: Sense of your body in space (judging distances, bumping into things or people)
    - code: interoception
      it: Sensazioni interne (sete, caldo nel corpo, stanchezza, bisogno del bagno)
      en: Inner sensations (thirst, feeling hot inside, tiredness, needing the toilet)
    attention_check:
      it: 'Controllo: per questa riga seleziona 2'
      expected: 2
      note: 'Not a sense: drop from persona; participant fails check if value != 2.'
