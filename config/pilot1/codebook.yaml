  B2:
    type: scale_1_5
    text_en: How comfortable they would feel spending 20 minutes here (1 = not at all, 5 = very comfortable)
    json_key: B2_comfort
  B3:
    type: grid_1_5
    text_en: How much each situation would be a problem here (1 = not at all, 5 = very much)
    json_key: B3_situations
    rows:
